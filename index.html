
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar System 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#030611;color:white;font-family:Arial,sans-serif;overflow-x:hidden}
header{text-align:center;padding:20px 8px 8px}
h1{margin:0;color:#8deaff;letter-spacing:3px;font-size:clamp(21px,5vw,34px)}
header p{color:#98a9c7;font-size:13px}
.scene{height:min(68vh,570px);min-height:390px;position:relative;overflow:hidden;touch-action:pan-y}
.space{position:absolute;inset:0;display:grid;place-items:center;transform:scale(var(--zoom,1));transition:transform .2s}
.sun{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,#fff6b0,#ffb000 50%,#ff4c00);box-shadow:0 0 25px #ffb000,0 0 65px #ff730080;position:absolute;z-index:3}
.orbit{position:absolute;border:1px solid #8fa8d52c;border-radius:50%;aspect-ratio:1}
.planet{position:absolute;left:50%;top:0;width:100%;height:100%;border-radius:50%;animation:orbit linear infinite;cursor:pointer}
.ball{position:absolute;left:50%;top:0;width:var(--size);height:var(--size);border-radius:50%;background:var(--color);box-shadow:inset -5px -3px 8px #0009,0 0 8px var(--color);transform:translate(-50%,-50%)}
.planet-name{position:absolute;left:50%;top:0;transform:translate(-50%,-24px);font-size:10px;color:#dbeaff;white-space:nowrap}
.saturn .ball:after{content:"";position:absolute;width:180%;height:55%;border:3px solid #d6b68d;border-radius:50%;left:-40%;top:22%;transform:rotate(-20deg)}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px}
button{border:1px solid #37628c;background:#0b1930;color:#d8f6ff;padding:11px 14px;border-radius:9px;font-size:13px}
button:active{background:#173b5a}
.info{margin:10px auto 25px;max-width:520px;padding:16px;border:1px solid #253957;border-radius:14px;background:#091222;width:calc(100% - 28px)}
.info h2{margin:0 0 8px;color:#8deaff}
.info p{color:#b6c6de;line-height:1.5;font-size:14px}
.small{font-size:11px!important;color:#7185a6!important}
@keyframes orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
<h1>SOLAR SYSTEM</h1>
<p>EXPLORE OUR COSMIC NEIGHBOURHOOD</p>
</header>
<div class="scene">
<div class="space" id="space">
<div class="sun" title="Sun"></div>
</div>
</div>
<div class="controls">
<button id="pause">⏸ Pause</button>
<button id="slower">− Speed</button>
<button id="faster">+ Speed</button>
<button id="zoomOut">− Zoom</button>
<button id="zoomIn">+ Zoom</button>
</div>
<div class="info">
<h2 id="name">Welcome, Explorer!</h2>
<p id="desc">Tap any planet to learn about it. Watch the planets orbit around the Sun.</p>
<p class="small">Orbit sizes and speeds are illustrative, not to scale.</p>
</div>
<script>
const planets=[
{name:"Mercury",size:5,color:"#aaa9a5",orbit:66,time:7,desc:"The smallest planet and the closest to the Sun. A rocky world with extreme temperatures."},
{name:"Venus",size:9,color:"#e4b16c",orbit:91,time:10,desc:"Our hottest planet, wrapped in a thick atmosphere rich in carbon dioxide."},
{name:"Earth",size:10,color:"#319cff",orbit:118,time:14,desc:"Our home planet, with liquid water on the surface and life as we know it."},
{name:"Mars",size:8,color:"#ef6846",orbit:145,time:18,desc:"The Red Planet. Scientists study its ancient landscapes for clues about past water."},
{name:"Jupiter",size:20,color:"#d5ae87",orbit:178,time:26,desc:"The largest planet in our solar system. Its atmosphere contains enormous storms."},
{name:"Saturn",size:17,color:"#e4d0a0",orbit:215,time:34,desc:"A gas giant famous for its spectacular rings made mostly of ice and rocky debris."},
{name:"Uranus",size:13,color:"#83e5e8",orbit:252,time:43,desc:"An ice giant that rotates on its side compared with most planets."},
{name:"Neptune",size:13,color:"#477bff",orbit:290,time:53,desc:"A distant ice giant with extremely powerful winds."}
];
const space=document.getElementById("space");
let speed=1,paused=false,zoom=1;
planets.forEach(p=>{
 const orbit=document.createElement("div");
 orbit.className="orbit";
 orbit.style.width=p.orbit*2+"px";
 orbit.style.height=p.orbit*2+"px";
 const planet=document.createElement("div");
 planet.className="planet"+(p.name==="Saturn"?" saturn":"");
 planet.style.animationDuration=p.time+"s";
 planet.style.animationPlayState="running";
 const ball=document.createElement("div");
 ball.className="ball";
 ball.style.setProperty("--size",p.size+"px");
 ball.style.setProperty("--color",p.color);
 const label=document.createElement("span");
 label.className="planet-name";
 label.textContent=p.name;
 ball.appendChild(label);
 planet.appendChild(ball);
 orbit.appendChild(planet);
 space.appendChild(orbit);
 planet.addEventListener("click",()=>{
  document.getElementById("name").textContent=p.name;
  document.getElementById("desc").textContent=p.desc;
 });
});
function updateSpeed(){
 document.querySelectorAll(".planet").forEach((el,i)=>{
  el.style.animationDuration=(planets[i].time/speed)+"s";
  el.style.animationPlayState=paused?"paused":"running";
 });
 document.getElementById("pause").textContent=paused?"▶ Resume":"⏸ Pause";
}
document.getElementById("pause").onclick=()=>{paused=!paused;updateSpeed()};
document.getElementById("faster").onclick=()=>{speed=Math.min(4,speed*1.25);updateSpeed()};
document.getElementById("slower").onclick=()=>{speed=Math.max(.25,speed/1.25);updateSpeed()};
document.getElementById("zoomIn").onclick=()=>{zoom=Math.min(1.4,zoom+.1);space.style.setProperty("--zoom",zoom)};
document.getElementById("zoomOut").onclick=()=>{zoom=Math.max(.55,zoom-.1);space.style.setProperty("--zoom",zoom)};
</script>
</body>
</html>
